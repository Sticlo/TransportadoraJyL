<header class="header" [class.header--open]="menuOpen()">
  <div class="header__shell">
    <a
      class="header__brand"
      routerLink="/"
      (click)="closeMenu()"
      [attr.aria-label]="company"
    >
      <img
        class="header__logo"
        src="/images/logo-jl-sm.webp"
        alt=""
        width="280"
        height="211"
        fetchpriority="high"
      />
    </a>

    <button
      class="header__burger"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-nav"
      aria-label="Abrir menú"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
    </button>

    <nav class="header__nav" id="site-nav" [attr.aria-hidden]="!menuOpen()">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <a
      class="header__cta"
      [href]="whatsapp"
      target="_blank"
      rel="noopener noreferrer"
      (click)="closeMenu()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M20.5 3.5A11 11 0 0 0 2.1 17.2L1 23l5.9-1.1A11 11 0 0 0 20.5 3.5Zm-8.5 17a9 9 0 0 1-4.6-1.3l-.3-.2-3.5.7.7-3.4-.2-.3A9 9 0 1 1 12 20.5Zm5.2-6.7c-.3-.1-1.7-.8-1.9-.9s-.5-.1-.7.2-.8.9-1 1.1-.4.2-.7.1a7.4 7.4 0 0 1-2.2-1.4 8.2 8.2 0 0 1-1.5-1.9c-.2-.3 0-.5.1-.6l.5-.6c.1-.2.1-.3 0-.5l-.9-2.1c-.2-.5-.5-.4-.7-.4h-.6c-.2 0-.5.1-.8.4s-1 1-1 2.4 1.1 2.8 1.2 3 .2.3 2.1 3.3a13.4 13.4 0 0 0 3.4 2.6c1.3.5 1.9.5 2.6.4s1.7-.7 2-1.4.3-1.2.2-1.4-.3-.2-.6-.3Z"
        />
      </svg>
      WhatsApp
    </a>
  </div>
</header>
