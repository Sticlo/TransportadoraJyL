<section class="section coverage" id="cobertura">
  <div class="section__inner">
    <div class="coverage__copy" appReveal>
      <span class="section__eyebrow">Cobertura</span>
      <h2 class="section__title">A todo Colombia</h2>
      <p class="section__lead">
        Movemos mercancía entre ciudades de punta a punta del país. Una ruta clara,
        un trato directo y llegada puntual.
      </p>
      <ul class="coverage__cities">
        @for (city of cities; track city; let i = $index) {
          <li [style.--i]="i">{{ city }}</li>
        }
      </ul>
    </div>

    <div
      class="coverage__map"
      #mapRoot
      [class.coverage__map--active]="active()"
      aria-hidden="true"
    >
      <svg viewBox="0 0 360 460" class="map">
        <path
          class="map__land"
          d="M168 28c18 6 34 4 48 14 16 12 20 30 34 42 12 10 28 8 38 20 10 12 6 28 12 42 8 18 24 22 28 40 4 18-8 30-4 46 4 14 18 22 16 38-2 18-20 24-28 38-10 16-4 34-16 46-14 14-34 10-48 20-16 12-18 34-36 40-20 6-36-8-54-6-18 2-28 18-46 16-16-2-22-18-36-26-14-8-32-2-42-16-10-14 0-30-2-46-2-18-18-28-16-46 2-16 18-22 24-36 8-16 0-34 8-48 8-14 26-16 34-30 8-14 2-32 16-42 12-10 30-4 42-14 10-8 10-26 24-32z"
        />
        <path
          class="map__route"
          d="M190 70 C210 120, 150 160, 170 210 C190 250, 230 260, 210 310 C190 350, 150 360, 160 400"
        />
        <g class="map__dots">
          <circle cx="190" cy="70" r="5" />
          <circle cx="155" cy="150" r="5" />
          <circle cx="170" cy="210" r="5" />
          <circle cx="230" cy="270" r="5" />
          <circle cx="200" cy="330" r="5" />
          <circle cx="160" cy="400" r="5" />
        </g>
      </svg>
    </div>
  </div>
</section>
