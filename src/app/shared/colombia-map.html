              <circle class="co-map__halo" [attr.cx]="pin.x" [attr.cy]="pin.y" r="22" />
            }
            <circle class="co-map__dot" [attr.cx]="pin.x" [attr.cy]="pin.y" [attr.r]="pin.hub ? 10 : 7" />
            <text
              [attr.x]="pin.labelSide === 'left' ? pin.x - 16 : pin.x + 16"
              [attr.y]="pin.y + 7"
              [attr.text-anchor]="pin.labelSide === 'left' ? 'end' : 'start'"

            </text>
